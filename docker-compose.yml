services:
  etl:
    build: .
    working_dir: /app
    volumes:
      # codigo y docs por bind: editar sin reconstruir la imagen
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - ./const.py:/app/const.py:ro
      - ./configuracion.py:/app/configuracion.py:ro
      - ./queries:/app/queries
      # entrada de solo lectura, no la vamos a tocar nunca
      - ./data/grupo_5.csv:/app/data/grupo_5.csv:ro
      # entregables: tienen que sobrevivir en el host
      - ./data/processed:/app/data/processed
      # ~30 GB de crudos + la base duckdb; se van con `docker compose down -v`
      - work:/data
    environment:
      # dentro de la red de compose Fuseki se llama `fuseki`, no localhost
      FUSEKI_URL: http://fuseki:3030

  fuseki:
    # imagen solo amd64: en Apple Silicon corre emulada, mas lenta pero funciona
    image: stain/jena-fuseki:latest
    platform: linux/amd64
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      TDB: "2"
      JVM_ARGS: -Xmx3g
    volumes:
      - fuseki:/fuseki

volumes:
  work:
  fuseki:
